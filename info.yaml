# Tiny Tapeout project information
project:
  title:        "COMPAX memory trial: UART + 64 B latch memory"
  author:       "Ayush Jain"
  discord:      ""
  description:  "Trial of a latch-based 64-byte memory with a UART read/write interface, to validate latch storage in the Tiny Tapeout flow before building COMPAX on it"
  language:     "Verilog"
  clock_hz:     25000000

  tiles: "2x2"

  top_module:  "tt_um_ayush130305_memtrial"

  source_files:
    - "project.v"
    - "cmd_fsm.v"
    - "latch_mem.v"
    - "uart_rx.v"
    - "uart_tx.v"

pinout:
